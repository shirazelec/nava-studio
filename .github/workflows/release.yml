name: Build & Release Nava Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb & tarball)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            nasm \
            libgtk-4-dev \
            libgraphene-1.0-dev \
            libpulse-dev \
            libvulkan-dev

      - name: Cache Vendored FFmpeg Dist
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-dist
          key: ffmpeg-dist-${{ runner.os }}-${{ hashFiles('third_party/ffmpeg/**') }}

      - name: Build Release Packages
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-release.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS (ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install cmake pkg-config gtk4 ffmpeg dylibbundler

      - name: Configure & Build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Package macOS DMG & Tarball
        run: |
          VERSION=$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' src/app.c | head -1)
          : "${VERSION:=1.0.0}"
          PKG_DIR="NavaStudio-${VERSION}-macos-arm64"
          ./scripts/make-dmg.sh build
          tar -czf "dist/${PKG_DIR}.tar.gz" -C dist "Nava Studio.app"
        shell: bash

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows (UCRT64)
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
            zip

      - name: Build with CMake (MSYS2)
        shell: msys2 {0}
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package Windows Zip (MSYS2)
        shell: msys2 {0}
        run: |
          VERSION=$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' src/app.c | head -1)
          : "${VERSION:=1.0.0}"
          PKG_DIR="NavaStudio-${VERSION}-windows-x64"
          mkdir -p "${PKG_DIR}" dist
          cp build/nava-studio.exe "${PKG_DIR}/"
          while true; do
            missing=0
            for bin in "${PKG_DIR}"/*.exe "${PKG_DIR}"/*.dll; do
              for dep in $(ldd "$bin" 2>/dev/null | grep -i "/ucrt64/" | awk '{print $3}'); do
                base=$(basename "$dep")
                if [ ! -f "${PKG_DIR}/$base" ] && [ -f "$dep" ]; then
                  cp "$dep" "${PKG_DIR}/" 2>/dev/null && missing=1
                fi
              done
            done
            [ $missing -eq 0 ] && break
          done
          strip -s "${PKG_DIR}"/*.exe "${PKG_DIR}"/*.dll 2>/dev/null || true
          mkdir -p "${PKG_DIR}/share/glib-2.0/schemas"
          cp -r /ucrt64/share/glib-2.0/schemas/* "${PKG_DIR}/share/glib-2.0/schemas/" 2>/dev/null || true
          glib-compile-schemas "${PKG_DIR}/share/glib-2.0/schemas" 2>/dev/null || true
          mkdir -p "${PKG_DIR}/share/icons"
          cp -r /ucrt64/share/icons/Adwaita "${PKG_DIR}/share/icons/" 2>/dev/null || true
          cp -r /ucrt64/share/icons/hicolor "${PKG_DIR}/share/icons/" 2>/dev/null || true
          if [ -d /ucrt64/lib/gdk-pixbuf-2.0 ]; then
            mkdir -p "${PKG_DIR}/lib/gdk-pixbuf-2.0"
            cp -r /ucrt64/lib/gdk-pixbuf-2.0/* "${PKG_DIR}/lib/gdk-pixbuf-2.0/" 2>/dev/null || true
            gdk-pixbuf-query-loaders > "${PKG_DIR}/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache" 2>/dev/null || true
          fi
          cp -r resources "${PKG_DIR}/"
          cp -r data "${PKG_DIR}/"
          (command -v zip >/dev/null && zip -r "dist/${PKG_DIR}.zip" "${PKG_DIR}") || 7z a "dist/${PKG_DIR}.zip" "${PKG_DIR}"

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Get-Content src/app.c | Select-String '^#define VERSION "(.*)"').Matches.Groups[1].Value
          if (-not $ver) { $ver = "1.0.0" }
          $pkgDir = "NavaStudio-$ver-windows-x64"
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$ver" "/DSourceDir=..\$pkgDir" scripts\installer.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-assets

      - name: Determine Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Nava Studio ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
